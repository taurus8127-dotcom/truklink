<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrukLink — Сброс пароля</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #D3E9FF 0%, #F2F8FF 50%, #D6EBFF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            color: #042240;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(4, 34, 64, 0.1);
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .logo span {
            color: #0095F6;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #4A607A;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 15px 24px;
            background: linear-gradient(90deg, #004C99, #0077D6);
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(0, 119, 214, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Truk<span>Link</span></div>
        <p>Нажмите кнопку ниже, чтобы открыть приложение TrukLink и задать новый пароль.</p>
        <a id="openAppBtn" class="btn" href="truklink://reset-password">Открыть TrukLink</a>
    </div>

        <script>
        (function () {
            var deepLink = "truklink://reset-password" + window.location.search + window.location.hash;
            var btn = document.getElementById("openAppBtn");
            if (btn) {
                btn.href = deepLink;
            }
            setTimeout(function () {
                window.location.href = deepLink;
            }, 150);
        })();
    </script>

            window.location.replace(deepLink);
        })();
    </script>
</body>
</html>
